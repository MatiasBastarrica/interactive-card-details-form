<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Frontend Mentor | Interactive card details form</title>
  </head>
  <body>
    <div class="card-display">
      <div class="decorative-bg"></div>
      <div class="wrapper">
        <div class="card-back-container">
          <div class="card-back__cvc">000</div>
        </div>
        <div class="card-front-container">
          <img src="./images/card-logo.svg" alt="" class="front-card-img" />
          <div class="wrapper">
            <div class="card-front__number">
              <span class="first-num-group">0000</span>
              <span class="second-num-group">0000</span>
              <span class="third-num-group">0000</span>
              <span class="fourth-num-group">0000</span>
            </div>
            <div class="card-front-details-container">
              <div class="card-front__name">Jane Appleseed</div>
              <div class="card-front__expiration-date">
                <span class="expiration-month">00</span>
                <span>/</span>
                <span class="expiration-year">00</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <main>
      <form action="#">
        <div>
          <label for="cardholder-name">Cardholder Name</label>
          <input
            type="text"
            name="cardholder-name"
            placeholder="e.g. Jane Appleseed"
            id="cardholder-name"
          />
          <div class="invalid-message hidden"></div>
        </div>
        <div>
          <label for="card-number">Card Number</label>
          <input
            type="text"
            name="card-number"
            id="card-number"
            placeholder="e.g. 1234 5678 9123 0000"
          />
          <div class="invalid-message hidden"></div>
        </div>
        <div>
          <div class="form-row">
            <div class="form-col">
              <fieldset>
                <legend>Exp. Date (MM/YY)</legend>
                <div class="wrapper">
                  <input type="text" name="month" id="month" placeholder="MM" />

                  <input type="text" name="year" id="year" placeholder="YY" />
                </div>
                <div class="invalid-message hidden"></div>
              </fieldset>
            </div>
            <div class="form-col">
              <label for="cvc">CVC</label>
              <input type="text" name="cvc" id="cvc" placeholder="e.g. 123" />
              <div class="invalid-message hidden"></div>
            </div>
          </div>
        </div>
        <button type="submit">Confirm</button>
      </form>
      <div class="complete-state hidden">
        <img src="./images/icon-complete.svg" alt="" />
        <h1>Thank you!</h1>
        <p>We've added your card details</p>
        <button type="button">Continue</button>
      </div>
    </main>
    <script src="./script.js" type="module"></script>
  </body>
</html>
