<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Interactive card details form</title>
  </head>
  <body>
    <div class="card-display">
      <div class="card-back-container">
        <img src="./images/bg-card-back.png" alt="" />
        <div class="card-back__cvc">000</div>
      </div>
      <div class="card-front-container">
        <img src="./images/bg-card-front.png" alt="" />
        <div class="card-front__number">0000 0000 0000 0000</div>
        <div class="card-front-details-container">
          <div class="card-front__name">Jane Appleseed</div>
          <div class="card-front__expiration-date">00/00</div>
        </div>
      </div>
    </div>
    <main>
      <form action="#">
        <div>
          <label for="cardholder-name">Cardholder Name</label>
          <input
            type="text"
            name="cardholder-name"
            placeholder="e.g. Jane Appleseed"
            id="cardholder-name"
          />
        </div>
        <div>
          <label for="card-number">Card Number</label>
          <input
            type="number"
            name="card-number"
            id="card-number"
            placeholder="e.g. 1234 5678 9123 0000"
          />
        </div>
        <div>
          <div class="form-row">
            <div class="form-col">
              <fieldset>
                <legend>Exp. Date (MM/YY)</legend>
                <input type="number" name="month" id="month" placeholder="MM" />
                <input type="number" name="year" id="year" placeholder="YY" />
              </fieldset>
            </div>
            <div class="form-col">
              <label for="cvc">CVC</label>
              <input type="number" name="cvc" id="cvc" placeholder="e.g. 123" />
            </div>
          </div>
        </div>
        <button type="submit">Confirm</button>
      </form>
      <div class="complete-state hidden">
        <img src="./images/icon-complete.svg" alt="" />
        <h1>Thank you!</h1>
        <p>We've added your card details</p>
        <button type="button">Continue</button>
      </div>
    </main>
  </body>
</html>
